[workspace]
resolver = "2"
members = [
    "rolen-core",
    "rolen-orchestrator",
    "rolen-providers",
    "rolen-runtime",
    "rolen-cliadapters",
    "rolen-tui",
    "rolen-gui",
    "rolen-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
# Floor set by the dear-imgui-rs stack (MSRV 1.92). Declaring it makes cargo's
# resolver MSRV-aware, so a future `cargo update` cannot silently pull a
# dependency that needs a newer compiler than the project claims to support.
rust-version = "1.95"

[workspace.dependencies]
appcui = "=0.4.17"
rolen-core = { path = "rolen-core" }
rolen-tui = { path = "rolen-tui" }
rolen-providers = { path = "rolen-providers" }
rolen-runtime = { path = "rolen-runtime" }
rolen-orchestrator = { path = "rolen-orchestrator" }
rolen-cliadapters = { path = "rolen-cliadapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = "thin"
