[workspace]
resolver = "2"
members = [
    "maestro-core",
    "maestro-orchestrator",
    "maestro-providers",
    "maestro-runtime",
    "maestro-cliadapters",
    "maestro-tui",
    "maestro-gui",
    "maestro-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Floor set by egui/eframe 0.36. Declaring it makes cargo's resolver
# MSRV-aware, so a future `cargo update` cannot silently pull a dependency
# that needs a newer compiler than the project claims to support.
rust-version = "1.95"

[workspace.dependencies]
appcui = "=0.4.17"
# The GUI front-end (route C): egui/eframe, chosen because the whole workspace is
# synchronous - blocking work goes on a worker thread and the immediate-mode UI
# redraws from a snapshot, with no async runtime to bridge.
# accesskit is left out: it is not needed yet and drags extra deps into CI.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui_extras = "0.36"
maestro-core = { path = "maestro-core" }
maestro-tui = { path = "maestro-tui" }
maestro-gui = { path = "maestro-gui" }
maestro-providers = { path = "maestro-providers" }
maestro-runtime = { path = "maestro-runtime" }
maestro-orchestrator = { path = "maestro-orchestrator" }
maestro-cliadapters = { path = "maestro-cliadapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = "thin"
