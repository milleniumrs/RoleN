name: Release

# Tag a version and the binaries build themselves:
#   git tag v0.1.0 && git push origin v0.1.0
# (or run this workflow manually and type the tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN: rolen
  # on workflow_dispatch GITHUB_REF_NAME is the *branch*, so the explicit tag
  # input must win; on a tag push there is no input and ref_name is the tag
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Checking out a tag that does not exist fails inside `git fetch` with a bare
  # "exit code 1", once per matrix leg. Resolve it here instead so a mistyped or
  # not-yet-created tag says so, once, before five builds start.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag exists
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${{ github.repository }}.git"
          if ! git ls-remote --exit-code --tags "$remote" "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error title=No such tag::'${VERSION}' is not a tag in this repository. Create and push it first:  git tag ${VERSION} && git push origin ${VERSION}"
            exit 1
          fi
          echo "building ${VERSION}"

  build:
    needs: resolve
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # never let an unavailable runner label hang a release for hours
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `gui` marks the legs that also ship the desktop binary. Every
          # native leg does; linux-aarch64 is the exception because it is the
          # only cross-compiled Linux target and cimgui's C++ would need a
          # cross toolchain for no demonstrated demand.
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            gui: true
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            gui: true
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            gui: true
          # GitHub retired the macos-13 (Intel) image, so the x86_64 binary is
          # cross-compiled from the Apple Silicon runner instead of waiting
          # forever for an Intel runner that will never be assigned.
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            gui: true

    steps:
      # without an explicit ref a manual run builds the default branch and
      # then publishes it under the tag name — build the tag that was asked for
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # AppCUI needs ncurses + X11 clipboard libraries on Linux; the GUI's
      # winit backend adds xkbcommon and wayland. No mesa dev packages: glutin
      # loads GL through dlopen at runtime, so the headers are never needed.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev

      - name: Build the CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p rolen-cli

      - name: Build the GUI
        if: matrix.gui
        run: cargo build --release --locked --target ${{ matrix.target }} -p rolen-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi

          archive() {
            (
              cd dist
              if [ "${{ matrix.archive }}" = "zip" ]; then
                7z a -tzip "$1.zip" "$1" >/dev/null
              else
                tar czf "$1.tar.gz" "$1"
              fi
            )
          }

          cli="${BIN}-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/${cli}"
          cp "target/${{ matrix.target }}/release/${BIN}${ext}" "dist/${cli}/"
          cp README.md LICENSE "dist/${cli}/"
          cp docs/TUI-DESIGN.pdf "dist/${cli}/" || true
          archive "${cli}"

          if [ "${{ matrix.gui }}" = "true" ]; then
            gui="${BIN}-gui-${VERSION}-${{ matrix.label }}"
            mkdir -p "dist/${gui}"
            cp "target/${{ matrix.target }}/release/${BIN}-gui${ext}" "dist/${gui}/"
            cp README.md LICENSE "dist/${gui}/"
            archive "${gui}"
          fi

          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the artifacts are published here, so no source checkout is needed
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: RoleN ${{ env.VERSION }}
          draft: false
          generate_release_notes: true
          body: |
            ## Downloads

            CLI + TUI — the `rolen` binary, the README, the licence and the design PDF:

            | OS | Architecture | File |
            |---|---|---|
            | Windows | x86_64 | `rolen-${{ env.VERSION }}-windows-x86_64.zip` |
            | Linux | x86_64 | `rolen-${{ env.VERSION }}-linux-x86_64.tar.gz` |
            | Linux | aarch64 | `rolen-${{ env.VERSION }}-linux-aarch64.tar.gz` |
            | macOS | Apple Silicon | `rolen-${{ env.VERSION }}-macos-aarch64.tar.gz` |
            | macOS | Intel | `rolen-${{ env.VERSION }}-macos-x86_64.tar.gz` |

            Desktop GUI — the separate `rolen-gui` application:

            | OS | Architecture | File |
            |---|---|---|
            | Windows | x86_64 | `rolen-gui-${{ env.VERSION }}-windows-x86_64.zip` |
            | Linux | x86_64 | `rolen-gui-${{ env.VERSION }}-linux-x86_64.tar.gz` |
            | macOS | Apple Silicon | `rolen-gui-${{ env.VERSION }}-macos-aarch64.tar.gz` |
            | macOS | Intel | `rolen-gui-${{ env.VERSION }}-macos-x86_64.tar.gz` |

            Verify with `sha256sum -c SHA256SUMS`.

            ### Quick start
            ```sh
            rolen config doctor          # verify the environment
            rolen provider detect --register
            rolen                        # launch the TUI
            rolen-gui                    # launch the desktop window
            ```
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
