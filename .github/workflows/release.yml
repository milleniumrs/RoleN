name: Release

# Tag a version and the binaries build themselves:
#   git tag v0.1.0 && git push origin v0.1.0
# (or run this workflow manually and type the tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN: maestro
  # on workflow_dispatch GITHUB_REF_NAME is the *branch*, so the explicit tag
  # input must win; on a tag push there is no input and ref_name is the tag
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Checking out a tag that does not exist fails inside `git fetch` with a bare
  # "exit code 1", once per matrix leg. Resolve it here instead so a mistyped or
  # not-yet-created tag says so, once, before five builds start.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag exists
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${{ github.repository }}.git"
          if ! git ls-remote --exit-code --tags "$remote" "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error title=No such tag::'${VERSION}' is not a tag in this repository. Create and push it first:  git tag ${VERSION} && git push origin ${VERSION}"
            exit 1
          fi
          echo "building ${VERSION}"

  build:
    needs: resolve
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # never let an unavailable runner label hang a release for hours
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # GitHub retired the macos-13 (Intel) image, so the x86_64 binary is
          # cross-compiled from the Apple Silicon runner instead of waiting
          # forever for an Intel runner that will never be assigned.
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      # without an explicit ref a manual run builds the default branch and
      # then publishes it under the tag name — build the tag that was asked for
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # AppCUI needs ncurses + X11 clipboard libraries on Linux
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p maestro-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${BIN}-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/${STAGE}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "dist/${STAGE}/"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "dist/${STAGE}/"
          fi
          cp README.md LICENSE "dist/${STAGE}/"
          cp docs/TUI-DESIGN.pdf "dist/${STAGE}/" || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${STAGE}.zip" "${STAGE}" >/dev/null
          else
            tar czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the artifacts are published here, so no source checkout is needed
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Maestro ${{ env.VERSION }}
          draft: false
          generate_release_notes: true
          body: |
            ## Downloads

            | OS | Architecture | File |
            |---|---|---|
            | Windows | x86_64 | `maestro-*-windows-x86_64.zip` |
            | Linux | x86_64 | `maestro-*-linux-x86_64.tar.gz` |
            | Linux | aarch64 | `maestro-*-linux-aarch64.tar.gz` |
            | macOS | Apple Silicon | `maestro-*-macos-aarch64.tar.gz` |
            | macOS | Intel | `maestro-*-macos-x86_64.tar.gz` |

            Each archive contains the `maestro` binary, the README, the licence and the design PDF.
            Verify with `sha256sum -c SHA256SUMS`.

            ### Quick start
            ```sh
            maestro config doctor          # verify the environment
            maestro provider detect --register
            maestro                        # launch the TUI
            maestro gui                    # launch the desktop window
            ```
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
