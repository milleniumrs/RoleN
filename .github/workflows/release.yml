name: Release

# Tag a version and the binaries build themselves:
#   git tag v0.1.0 && git push origin v0.1.0
# (or run this workflow manually and type the tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN: maestro

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - label: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # AppCUI needs ncurses + X11 clipboard libraries on Linux
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p maestro-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          STAGE="${BIN}-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/${STAGE}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "dist/${STAGE}/"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "dist/${STAGE}/"
          fi
          cp README.md LICENSE "dist/${STAGE}/"
          cp docs/TUI-DESIGN.pdf "dist/${STAGE}/" || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${STAGE}.zip" "${STAGE}" >/dev/null
          else
            tar czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Maestro ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## Downloads

            | OS | Architecture | File |
            |---|---|---|
            | Windows | x86_64 | `maestro-*-windows-x86_64.zip` |
            | Linux | x86_64 | `maestro-*-linux-x86_64.tar.gz` |
            | Linux | aarch64 | `maestro-*-linux-aarch64.tar.gz` |
            | macOS | Apple Silicon | `maestro-*-macos-aarch64.tar.gz` |
            | macOS | Intel | `maestro-*-macos-x86_64.tar.gz` |

            Each archive contains the `maestro` binary, the README, the licence and the design PDF.
            Verify with `sha256sum -c SHA256SUMS`.

            ### Quick start
            ```sh
            maestro config doctor          # verify the environment
            maestro provider detect --register
            maestro                        # launch the TUI
            ```
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
