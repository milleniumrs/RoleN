name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI runners have no usable OS keychain, so pin the secret backend to the
  # age-encrypted vault (and give it a password) for deterministic runs.
  MAESTRO_SECRETS_BACKEND: vault
  MAESTRO_VAULT_PASSWORD: ci-vault-password

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # AppCUI pulls in ncurses and the X11 clipboard stack on Linux
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: fmt (Maestro packages only — do not follow path deps)
        run: cargo fmt -p maestro-core -p maestro-providers -p maestro-runtime -p maestro-orchestrator -p maestro-cliadapters -p maestro-tui -p maestro-cli -- --check

      - name: clippy
        run: cargo clippy --workspace -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: headless smoke (no providers configured in CI)
        run: |
          cargo run -p maestro-cli -- config doctor
          cargo run -p maestro-cli -- quota --json
          cargo run -p maestro-cli -- rule list
