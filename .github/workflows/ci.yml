name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI runners have no usable OS keychain, so pin the secret backend to the
  # age-encrypted vault (and give it a password) for deterministic runs.
  ROLEN_SECRETS_BACKEND: vault
  ROLEN_VAULT_PASSWORD: ci-vault-password

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Without this a stalled step runs until GitHub's six-hour limit. Two runs
    # sat for eight hours on the apt step before anyone noticed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # AppCUI pulls in ncurses and the X11 clipboard stack on Linux; the GUI's
      # winit backend adds xkbcommon and wayland on top.
      #
      # No mesa dev packages: glutin loads GL through dlopen at runtime, so the
      # headers are not needed to build, and libgl1-mesa-dev alone pulled in 19
      # extra packages including the vulkan and vdpau drivers.
      #
      # DEBIAN_FRONTEND and the lock timeout are here because this step has hung
      # twice waiting on a dpkg lock held by the runner's unattended-upgrades;
      # apt would otherwise wait forever rather than fail.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends \
            libncurses-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev

      - name: fmt (RoleN packages only — do not follow path deps)
        run: cargo fmt -p rolen-core -p rolen-providers -p rolen-runtime -p rolen-orchestrator -p rolen-cliadapters -p rolen-tui -p rolen-gui -p rolen-cli -- --check

      - name: clippy
        run: cargo clippy --workspace -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: headless smoke (no providers configured in CI)
        run: |
          cargo run -p rolen-cli -- config doctor
          cargo run -p rolen-cli -- quota --json
          cargo run -p rolen-cli -- rule list
