[package]
name = "rolen-gui"
description = "Dear ImGui desktop front-end for RoleN (standalone binary, peer of rolen-tui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rolen-gui"
path = "src/main.rs"

[lib]
name = "rolen_gui"
path = "src/lib.rs"

[dependencies]
# Dear ImGui front-end: dear-imgui-rs (cimgui, docking branch) with the winit
# platform backend and the glow OpenGL renderer. The whole workspace is
# synchronous - blocking work goes on a worker thread and the immediate-mode
# UI redraws from a snapshot, with no async runtime to bridge.
# glutin loads GL through dlopen at runtime, so no system GL headers are
# needed to build on any platform - only a C++ compiler for cimgui.
dear-imgui-rs = "0.17"
dear-imgui-winit = "0.17"
dear-imgui-glow = "0.17"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.18"
raw-window-handle = "0.6"
rolen-core.workspace = true
rolen-providers.workspace = true
rolen-cliadapters.workspace = true
chrono.workspace = true
